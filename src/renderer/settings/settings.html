<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file: data: blob:; media-src file: data: blob:; style-src 'self' file:; script-src 'self' file:;"
    />
    <link rel="stylesheet" href="settings.css" />
    <title>Overlet</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo-image" src="../../assets/icon.png" alt="" />
        <span class="brand-name">Overlet</span>
      </div>
      <div class="hint topbar-hint">Drop files here to add them · right-click a widget for options · scroll to resize</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav class="nav">
          <button class="nav-btn active" data-view="widgets">Widgets</button>
          <button class="nav-btn" data-view="global">Global</button>
          <button class="nav-btn" data-view="about">About</button>
        </nav>

        <div class="widget-list-wrap" id="widget-list-wrap">
          <button class="add-btn" id="add-btn">＋ Import Media</button>
          <ul class="widget-list" id="widget-list"></ul>
        </div>
      </aside>

      <main class="content" id="content"></main>
    </div>

    <script src="../shared/file-url.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
